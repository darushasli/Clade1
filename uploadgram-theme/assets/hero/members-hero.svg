<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="mh-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B7CF8"/><stop offset="1" stop-color="#5B4FE0"/>
    </linearGradient>
    <linearGradient id="mh-plane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf2ff"/><stop offset="1" stop-color="#c3d4ff"/>
    </linearGradient>
    <linearGradient id="mh-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#4C93F7"/><stop offset="1" stop-color="#9E93F9"/>
    </linearGradient>
    <filter id="mh-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1a1350" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- glow -->
  <circle cx="150" cy="140" r="120" fill="#7C6CF5" opacity="0.16"/>

  <!-- main glass tile -->
  <g filter="url(#mh-shadow)">
    <rect x="58" y="48" width="184" height="184" rx="42" fill="url(#mh-tile)"/>
    <rect x="58" y="48" width="184" height="184" rx="42" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
  </g>

  <!-- telegram plane -->
  <path d="M198 96 L112 138 l30 12 12 34 18-24 30 18 z" fill="url(#mh-plane)" opacity="0.96"/>
  <path d="M198 96 L154 160 l-12 20 -3-34 z" fill="#a9c0ff" opacity="0.85"/>

  <!-- growth bars -->
  <g>
    <rect x="96"  y="178" width="20" height="30" rx="5" fill="url(#mh-bar)" opacity="0.95"/>
    <rect x="124" y="166" width="20" height="42" rx="5" fill="url(#mh-bar)" opacity="0.95"/>
    <rect x="152" y="150" width="20" height="58" rx="5" fill="url(#mh-bar)" opacity="0.95"/>
  </g>

  <!-- member avatars -->
  <g>
    <circle cx="216" cy="196" r="20" fill="#F4B740"/>
    <circle cx="216" cy="189" r="7" fill="#fff"/>
    <path d="M203 210c0-8 6-13 13-13s13 5 13 13z" fill="#fff"/>
  </g>
  <circle cx="82" cy="92" r="10" fill="#4C93F7" opacity="0.9"/>
  <circle cx="238" cy="70" r="6" fill="#9E93F9" opacity="0.9"/>
</svg>
