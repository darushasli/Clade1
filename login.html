<!DOCTYPE html>
<html lang="fa" dir="rtl" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود | UploadGram</title>
<meta name="description" content="ورود به حساب کاربری آپلود گرام برای مدیریت سفارش‌های فالوور اینستاگرام، ممبر تلگرام، یوتیوب، ساندکلاد و اسپاتیفای.">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://uploadgram.ir/login.html">

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithPopup, signInWithEmailAndPassword, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAC2AQfSrQwSxQsUbSrj996rnxUoaIW9SA",
    authDomain: "uploader-e2530.firebaseapp.com",
    projectId: "uploader-e2530",
    storageBucket: "uploader-e2530.firebasestorage.app",
    messagingSenderId: "420837680235",
    appId: "1:420837680235:web:f05d82b3b2ae0ba3debd2e",
    measurementId: "G-H6JGFSPRCF"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });

  // ✅ addEventListener به جای onclick — چون module scope با onclick کار نمی‌کنه
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('googleBtn').addEventListener('click', async () => {
      const btn = document.getElementById('googleBtn');
      btn.disabled = true;
      const googleSVG = btn.querySelector('span').innerHTML;
      btn.innerHTML = `<span><i class="fa-solid fa-circle-notch fa-spin"></i> در حال اتصال...</span>`;

      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;

        btn.innerHTML = `<span><i class="fa-solid fa-check"></i> خوش آمدید ${user.displayName}</span>`;
        btn.style.background = 'linear-gradient(135deg,#22d3ee,#3b82f6)';

        const toast = document.createElement('div');
        toast.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(6,182,212,.15);border:1px solid rgba(6,182,212,.4);color:#22d3ee;padding:10px 22px;border-radius:50px;font-size:.85rem;z-index:9999;backdrop-filter:blur(10px);display:flex;align-items:center;gap:8px;';
        toast.innerHTML = `<img src="${user.photoURL}" style="width:24px;height:24px;border-radius:50%;object-fit:cover;"> ورود موفق! خوش آمدید ${user.displayName} ✓`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 4000);

        setTimeout(() => { window.location.href = 'dashboard.html'; }, 900);

      } catch (error) {
        let msg = 'خطا در ورود با گوگل';
        if (error.code === 'auth/popup-closed-by-user') msg = 'پنجره ورود بسته شد';
        else if (error.code === 'auth/network-request-failed') msg = 'خطای اتصال به اینترنت';
        else if (error.code === 'auth/invalid-api-key') msg = 'Firebase Config اشتباه است';
        else if (error.code === 'auth/unauthorized-domain') msg = 'دامنه در Firebase تایید نشده — Authorized Domains را چک کنید';
        else if (error.code === 'auth/operation-not-allowed') msg = 'Google Sign-In در Firebase فعال نیست';
        else if (error.code === 'auth/popup-blocked') msg = 'مرورگر Popup را بلاک کرد';
        else msg = (error.code || error.message || 'خطای ناشناخته');

        const toast = document.createElement('div');
        toast.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);color:#f87171;padding:10px 22px;border-radius:50px;font-size:.85rem;z-index:9999;backdrop-filter:blur(10px);';
        toast.textContent = '❌ ' + msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 4000);

        btn.disabled = false;
        btn.innerHTML = googleSVG;
      }
    });

    function showToast(message, ok){
      const toast = document.createElement('div');
      const color = ok ? '6,182,212' : '239,68,68';
      const textColor = ok ? '#22d3ee' : '#f87171';
      toast.style.cssText = `position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(${color},.15);border:1px solid rgba(${color},.4);color:${textColor};padding:10px 22px;border-radius:50px;font-size:.85rem;z-index:9999;backdrop-filter:blur(10px);`;
      toast.textContent = (ok ? '✓ ' : '❌ ') + message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPass').value;
      const submitBtn = document.getElementById('loginSubmitBtn');
      submitBtn.disabled = true;
      try {
        await signInWithEmailAndPassword(auth, email, pass);
        showToast('ورود موفق! در حال انتقال...', true);
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 900);
      } catch (error) {
        let msg = 'خطا در ورود';
        if (error.code === 'auth/invalid-email') msg = 'فرمت ایمیل نادرست است';
        else if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') msg = 'ایمیل یا رمز عبور اشتباه است';
        else if (error.code === 'auth/wrong-password') msg = 'رمز عبور اشتباه است';
        else if (error.code === 'auth/too-many-requests') msg = 'تعداد تلاش بیش از حد — کمی بعد دوباره تلاش کنید';
        else if (error.code === 'auth/network-request-failed') msg = 'خطای اتصال به اینترنت';
        else msg = (error.code || error.message || 'خطای ناشناخته');
        showToast(msg, false);
      } finally {
        submitBtn.disabled = false;
      }
    });

    document.getElementById('eyeBtn').addEventListener('click', () => {
      const inp = document.getElementById('loginPass');
      const icon = document.getElementById('eyeIcon');
      if (inp.type === 'password') {
        inp.type = 'text';
        icon.className = 'fa-solid fa-eye-slash';
      } else {
        inp.type = 'password';
        icon.className = 'fa-solid fa-eye';
      }
    });
  });
</script>

<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Vazirmatn', 'sans-serif'],
          mono: ['Space Grotesk', 'sans-serif'],
        },
      }
    }
  }
</script>

<style>
  :root{
    --cyan:#06b6d4; --blue:#3b82f6; --indigo:#6366f1; --amber:#f59e0b;
    --ease-spring: cubic-bezier(0.22,1,0.36,1);
    --ease-pop: cubic-bezier(0.34,1.56,0.64,1);
  }

  *{ scrollbar-width: thin; scrollbar-color: rgba(6,182,212,0.4) transparent; }

  html{ scroll-behavior:smooth; }
  body{
    background:#020617; color:#f1f5f9;
    min-height:100vh; overflow-x:hidden; -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }

  /* ============ CURSOR GLOW (desktop) ============ */
  #cursorGlow{
    position:fixed; width:380px; height:380px; border-radius:50%;
    background:radial-gradient(circle, rgba(6,182,212,0.08), transparent 70%);
    pointer-events:none; z-index:1; transform:translate(-50%,-50%);
    transition: opacity .4s ease; opacity:0;
  }
  @media (hover:hover) and (pointer:fine){ #cursorGlow.active{ opacity:1; } }

  /* ============ CUSTOM TELEGRAM CURSOR (desktop) ============ */
  @media (hover:hover) and (pointer:fine){
    *{ cursor:none !important; }
  }
  #tgCursor{
    position:fixed; top:0; left:0; z-index:10000; pointer-events:none;
    display:none;
    transform:translate3d(0,0,0) translate(-50%,-50%) rotate(45deg);
    opacity:0; transition: opacity .35s ease, transform .12s linear;
    filter: drop-shadow(0 4px 14px rgba(34,211,238,.55));
  }
  @media (hover:hover) and (pointer:fine){ #tgCursor{ display:block; } }
  #tgCursor.active{ opacity:1; }
  #tgCursor i{
    font-size:30px;
    background:linear-gradient(135deg,#2AABEE,#229ED9);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  }

  /* ============ ANIMATED AURORA BACKGROUND ============ */
  .aurora{
    position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  }
  .aurora span{
    position:absolute; border-radius:50%; filter:blur(90px);
    animation: auroraDrift 22s ease-in-out infinite;
    opacity:.35;
  }
  .aurora span:nth-child(1){ width:520px;height:520px; background:#0891b2; top:-10%; right:-8%; }
  .aurora span:nth-child(2){ width:420px;height:420px; background:#4338ca; bottom:-15%; left:-10%; animation-delay:-7s; animation-duration:26s; }
  .aurora span:nth-child(3){ width:340px;height:340px; background:#1d4ed8; top:40%; left:50%; animation-delay:-14s; animation-duration:30s; }
  @keyframes auroraDrift{
    0%,100%{ transform:translate(0,0) scale(1); }
    33%{ transform:translate(40px,-30px) scale(1.12); }
    66%{ transform:translate(-30px,25px) scale(0.94); }
  }

  .grid-overlay{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size:48px 48px;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 0%, black 40%, transparent 90%);
  }

  /* ============ NETWORK / STARFIELD BACKGROUND (same as main site) ============ */
  #netCanvas{ position:fixed; inset:0; z-index:0; pointer-events:none; mix-blend-mode:screen; }

  /* ============ GLASS ============ */
  .glass{
    background:rgba(15,23,42,0.55);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,0.06);
  }

  .text-gradient-flow{
    background:linear-gradient(90deg,#22d3ee,#3b82f6,#818cf8,#22d3ee);
    background-size:300% auto;
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    animation: gradFlow 6s linear infinite;
  }
  @keyframes gradFlow{ to{ background-position:300% center; } }

  ::selection{ background:rgba(6,182,212,.35); color:#fff; }

  a:focus-visible, button:focus-visible{
    outline:2px solid #22d3ee; outline-offset:3px; border-radius:6px;
  }

  /* ============ REVEAL ============ */
  .reveal{
    opacity:0; transform:translateY(30px) scale(.97);
    transition: opacity .8s var(--ease-spring), transform .8s var(--ease-spring);
  }
  .reveal.in{ opacity:1; transform:translateY(0) scale(1); }

  /* ============ MAGNETIC + RIPPLE BUTTON ============ */
  .magnetic{ position:relative; will-change:transform; transition:transform .25s var(--ease-spring); }
  .ripple-host{ position:relative; overflow:hidden; }
  .ripple-dot{
    position:absolute; border-radius:50%; background:rgba(255,255,255,.5);
    transform:scale(0); pointer-events:none; animation: rippleAnim .65s ease-out forwards;
  }
  @keyframes rippleAnim{ to{ transform:scale(3.4); opacity:0; } }

  /* ============ LOGIN CARD ============ */
  .login-card{
    position:relative; z-index:10; width:100%; max-width:420px;
    border-radius:24px; padding:44px 32px 36px;
    box-shadow:0 25px 60px -15px rgba(0,0,0,.6);
  }
  .login-card::before{
    content:''; position:absolute; inset:-14%; z-index:-1; border-radius:50%;
    background:radial-gradient(circle, rgba(6,182,212,.16), transparent 70%);
    filter:blur(30px); animation: cardGlow 4.5s ease-in-out infinite;
  }
  @keyframes cardGlow{ 0%,100%{ opacity:.6; transform:scale(1); } 50%{ opacity:1; transform:scale(1.06); } }

  /* ============ TRAVELING BORDER LIGHT (card itself stays unchanged) ============ */
  @property --border-angle{ syntax:'<angle>'; initial-value:0deg; inherits:false; }
  .login-card::after{
    content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    padding:1.5px;
    background: conic-gradient(from var(--border-angle), transparent 0%, transparent 76%, rgba(34,211,238,.9) 86%, #e0f7ff 90%, rgba(34,211,238,.9) 94%, transparent 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: borderLightSpin 3.4s linear infinite;
  }
  @keyframes borderLightSpin{ to{ --border-angle:360deg; } }
  @media (prefers-reduced-motion: reduce){ .login-card::after{ animation:none; } }

  /* ============ FLOATING-LABEL INPUTS ============ */
  .inputBox{ position:relative; width:100%; }
  .inputBox input{
    width:100%; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.09);
    outline:none; padding:23px 14px 9px; border-radius:12px;
    color:#fff; font-weight:500; font-size:.95rem; transition:.3s;
  }
  .inputBox input:focus{
    border-color: rgba(34,211,238,.5); background:rgba(255,255,255,.06);
    box-shadow:0 0 0 3px rgba(34,211,238,.12);
  }
  .inputBox i{
    position:absolute; right:14px; top:16px; font-style:normal;
    color:#94a3b8; transition:.3s; pointer-events:none; font-size:.85rem;
  }
  .inputBox input:focus ~ i,
  .inputBox input:valid ~ i{
    transform:translateY(-8px) scale(.82); color:#22d3ee; right:12px;
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:.01ms !important; animation-iteration-count:1 !important;
      transition-duration:.01ms !important; scroll-behavior:auto !important;
    }
  }

  /* ============ ENHANCED BUTTON ============ */
  .btn-submit{
    position:relative; width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
    background:linear-gradient(135deg,#06b6d4 0%,#3b82f6 100%);
    color:#fff; font-weight:700; padding:14px 20px; border-radius:14px;
    font-family:'Vazirmatn',sans-serif; font-size:1rem;
    border:none; overflow:hidden;
    box-shadow: 0 6px 24px -6px rgba(6,182,212,.5), 0 0 0 0 rgba(34,211,238,0);
    transition: transform .25s var(--ease-spring), box-shadow .3s ease, filter .25s;
    cursor:none;
  }
  .btn-submit::before{
    content:''; position:absolute; inset:0; border-radius:inherit;
    background:linear-gradient(135deg,#22d3ee,#818cf8,#3b82f6);
    opacity:0; transition:opacity .35s ease;
  }
  .btn-submit::after{
    content:''; position:absolute; top:0; right:-100%; width:60%; height:100%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.3), transparent);
    transition:right .6s ease; pointer-events:none;
  }
  .btn-submit:hover{ transform:translateY(-3px) scale(1.02); box-shadow:0 0 32px rgba(34,211,238,.5), 0 14px 36px -8px rgba(6,182,212,.5); filter:brightness(1.07); }
  .btn-submit:hover::before{ opacity:1; }
  .btn-submit:hover::after{ right:130%; }
  .btn-submit:active{ transform:translateY(0) scale(.97); }
  .btn-submit span{ position:relative; z-index:1; display:flex; align-items:center; gap:8px; }

  /* ============ GOOGLE SIGN-IN BUTTON ============ */
  .btn-google {
    position:relative; width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.12);
    color:#e2e8f0; font-weight:600; padding:13px 20px; border-radius:14px;
    font-family:'Vazirmatn',sans-serif; font-size:.95rem;
    overflow:hidden; cursor:none;
    transition: transform .25s var(--ease-spring), background .3s, border-color .3s, box-shadow .3s;
  }
  .btn-google:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.22);
    transform: translateY(-2px);
    box-shadow: 0 8px 28px -8px rgba(0,0,0,0.4);
    color:#fff;
  }
  .btn-google:active { transform:translateY(0) scale(.97); }
  .btn-google:disabled { opacity:.6; }
  .btn-google span { display:flex; align-items:center; gap:10px; position:relative; z-index:1; }
  .google-icon {
    width:20px; height:20px; flex-shrink:0;
  }

  /* ============ DIVIDER ============ */
  .or-divider {
    display:flex; align-items:center; gap:12px; margin:4px 0;
  }
  .or-divider::before, .or-divider::after {
    content:''; flex:1; height:1px; background:rgba(255,255,255,0.07);
  }
  .or-divider span { color:#475569; font-size:.75rem; white-space:nowrap; }
  .link-btn{
    display:inline-flex; align-items:center; gap:4px;
    color:#22d3ee; font-weight:600; text-decoration:none;
    position:relative; transition:color .25s;
  }
  .link-btn::after{
    content:''; position:absolute; bottom:-2px; right:0; left:0; height:1px;
    background:linear-gradient(90deg,#22d3ee,#3b82f6);
    transform:scaleX(0); transition:transform .3s var(--ease-spring);
    transform-origin:right;
  }
  .link-btn:hover::after{ transform:scaleX(1); transform-origin:left; }

  .eye-toggle-btn{ color:#475569; transition:color .2s; }
  .eye-toggle-btn:hover{ color:#22d3ee; }
</style>
</head>
<body class="font-sans">

<div id="cursorGlow"></div>
<div id="tgCursor"><i class="fa-brands fa-telegram"></i></div>

<div class="aurora"><span></span><span></span><span></span></div>
<div class="grid-overlay"></div>
<canvas id="netCanvas" aria-hidden="true"></canvas>

<a href="index.html" class="fixed top-6 right-6 z-20 flex items-center gap-2 text-slate-400 hover:text-cyan-400 transition-colors text-xs sm:text-sm">
  <i class="fa-solid fa-arrow-right"></i> بازگشت به سایت
</a>

<div class="login-card glass reveal">

  <div class="flex flex-col items-center gap-2 mb-9">
    <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/20 mb-2">
      <i class="fa-solid fa-right-to-bracket text-white text-2xl"></i>
    </div>
    <h2 dir="ltr" class="text-2xl font-mono font-bold text-gradient-flow">UploadGram</h2>
    <p class="text-slate-400 text-sm">ورود به پنل مدیریت ممبر</p>
  </div>

  <form id="loginForm" class="flex flex-col gap-6">
    <div class="inputBox">
      <input type="email" id="loginEmail" required autocomplete="email" />
      <i>ایمیل</i>
    </div>
    <div class="inputBox" style="position:relative;">
      <input type="password" id="loginPass" required autocomplete="current-password" style="padding-left:44px;" />
      <i>رمز عبور</i>
      <button type="button" id="eyeBtn" class="eye-toggle-btn" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:.85rem;z-index:2;padding:0;">
        <i class="fa-solid fa-eye" id="eyeIcon"></i>
      </button>
    </div>

    <div class="flex items-center justify-between text-xs text-slate-400">
      <a href="#" class="hover:text-cyan-400 transition-colors">فراموشی رمز عبور</a>
      <a href="register.html" class="link-btn">
        ثبت‌نام رایگان <i class="fa-solid fa-arrow-left text-[10px]"></i>
      </a>
    </div>

    <button type="submit" id="loginSubmitBtn" class="btn-submit magnetic ripple-host">
      <span>
        <i class="fa-solid fa-right-to-bracket"></i>
        ورود به حساب
      </span>
    </button>

    <div class="or-divider"><span>یا ورود سریع با</span></div>

    <!-- Google Sign-In — onclick حذف شده، addEventListener در module script کار می‌کنه -->
    <button type="button" id="googleBtn" class="btn-google magnetic ripple-host">
      <span>
        <svg class="google-icon" viewBox="0 0 48 48">
          <path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34.5 6.5 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 19 13 24 13c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34.5 6.5 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.9 13.5-5l-6.2-5.2C29.4 35.5 26.8 36 24 36c-5.2 0-9.6-3.3-11.2-7.9l-6.6 5C9.5 39.5 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.3 4.1-4.1 5.5l6.2 5.2c-.4.4 6.6-4.8 6.6-14.7 0-1.3-.1-2.6-.4-3.9z"/>
        </svg>

<script>
// ============ NETWORK / STARFIELD BACKGROUND (same as main site) ============
(function () {
  const canvas = document.getElementById('netCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const animate = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  let w, h, particles, raf;

  function resize() {
    w = canvas.width = innerWidth * dpr;
    h = canvas.height = innerHeight * dpr;
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
    const count = innerWidth < 640 ? 24 : innerWidth < 1024 ? 42 : 64;
    particles = Array.from({ length: count }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.22 * dpr,
      vy: (Math.random() - 0.5) * 0.22 * dpr,
    }));
  }

  function render() {
    ctx.clearRect(0, 0, w, h);
    const maxDist = 130 * dpr;
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      if (animate) {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > w) p.vx *= -1;
        if (p.y < 0 || p.y > h) p.vy *= -1;
      }
      for (let j = i + 1; j < particles.length; j++) {
        const q = particles[j];
        const dx = p.x - q.x, dy = p.y - q.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < maxDist) {
          ctx.strokeStyle = `rgba(34,211,238,${0.14 * (1 - dist / maxDist)})`;
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
        }
      }
      ctx.fillStyle = 'rgba(34,211,238,0.6)';
      ctx.beginPath(); ctx.arc(p.x, p.y, 1.5 * dpr, 0, Math.PI * 2); ctx.fill();
    }
    if (animate) raf = requestAnimationFrame(render);
  }

  resize();
  render();
  window.addEventListener('resize', resize);
  if (animate) {
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) cancelAnimationFrame(raf);
      else render();
    });
  }
})();
</script>
<script>
// ============ ENTRANCE ============
requestAnimationFrame(() => requestAnimationFrame(() => {
  document.querySelector('.reveal').classList.add('in');
}));

// ============ CURSOR GLOW ============
const glow = document.getElementById('cursorGlow');
const finePointer = window.matchMedia('(hover:hover) and (pointer:fine)').matches;
window.addEventListener('mousemove', (e) => {
  glow.classList.add('active');
  glow.style.left = e.clientX + 'px';
  glow.style.top = e.clientY + 'px';
});
window.addEventListener('mouseleave', () => glow.classList.remove('active'));

// ============ CUSTOM TELEGRAM CURSOR ============
if (finePointer) {
  const tgCursor = document.getElementById('tgCursor');
  let tgX = window.innerWidth / 2, tgY = window.innerHeight / 2;
  let tgAngle = 45, tgScale = 1, tgShown = false;

  function paintTg(){
    tgCursor.style.transform = `translate3d(${tgX}px, ${tgY}px, 0) translate(-50%,-50%) rotate(${tgAngle}deg) scale(${tgScale})`;
  }

  window.addEventListener('mousemove', (e) => {
    const dx = e.clientX - tgX, dy = e.clientY - tgY;
    tgX = e.clientX; tgY = e.clientY;
    if (!tgShown) { tgShown = true; tgCursor.classList.add('active'); }
    if (Math.hypot(dx, dy) > 1) {
      tgAngle = Math.atan2(dy, dx) * (180 / Math.PI) + 45;
    }
    paintTg();
  });
  window.addEventListener('mousedown', () => { tgScale = .78; paintTg(); });
  window.addEventListener('mouseup', () => { tgScale = 1; paintTg(); });
  document.addEventListener('mouseleave', () => { tgShown = false; tgCursor.classList.remove('active'); });
}

// ============ MAGNETIC + RIPPLE BUTTON ============
document.querySelectorAll('.magnetic').forEach(btn => {
  btn.addEventListener('mousemove', (e) => {
    const r = btn.getBoundingClientRect();
    const x = e.clientX - r.left - r.width / 2;
    const y = e.clientY - r.top - r.height / 2;
    btn.style.transform = `translate(${x * 0.18}px, ${y * 0.35}px)`;
  });
  btn.addEventListener('mouseleave', () => { btn.style.transform = ''; });
});
document.querySelectorAll('.ripple-host').forEach(el => {
  el.addEventListener('click', function (e) {
    const r = this.getBoundingClientRect();
    const size = Math.max(r.width, r.height);
    const dot = document.createElement('span');
    dot.className = 'ripple-dot';
    dot.style.width = dot.style.height = size + 'px';
    dot.style.left = (e.clientX - r.left - size / 2) + 'px';
    dot.style.top = (e.clientY - r.top - size / 2) + 'px';
    this.appendChild(dot);
    dot.addEventListener('animationend', () => dot.remove());
  });
});
</script>
</body>
